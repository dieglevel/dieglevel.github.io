

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 800" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Một phần tư (góc trên trái); 3 phần còn lại được lật gương nên đối xứng tuyệt đối -->
    <g id="q">
      <!-- Biểu tượng góc -->
      <rect x="50" y="50" width="64" height="64" fill="#2a2f33" stroke="#d9dcd6" stroke-width="4"/>
      <rect x="66" y="66" width="32" height="32" fill="none" stroke="#d9dcd6" stroke-width="4"/>
      <rect x="78" y="78" width="8" height="8" fill="#d9dcd6"/>
      <!-- Cột dọc -->
      <rect x="330" y="30" width="70" height="200" fill="#2a2f33"/>
      <rect x="348" y="60" width="34" height="12" fill="#3d4449"/>
      <rect x="348" y="90" width="34" height="12" fill="#3d4449"/>
      <rect x="348" y="120" width="34" height="12" fill="#3d4449"/>
      <!-- Tay ngang -->
      <rect x="30" y="330" width="200" height="70" fill="#2a2f33"/>
      <rect x="60" y="348" width="12" height="34" fill="#3d4449"/>
      <rect x="90" y="348" width="12" height="34" fill="#3d4449"/>
      <rect x="120" y="348" width="12" height="34" fill="#3d4449"/>
      <!-- Giá vàng chữ L -->
      <path d="M140 140 H260 V180 H180 V260 H140 Z" fill="#b8923e"/>
      <!-- Khối vàng -->
      <rect x="226" y="226" width="74" height="74" rx="6" fill="#b8923e"/>
      <rect x="242" y="242" width="42" height="42" rx="4" fill="#8a6c2b"/>
      <!-- Đèn ngọc -->
      <circle cx="300" cy="160" r="10" fill="#2fd06a"/>
      <circle cx="160" cy="300" r="10" fill="#2fd06a"/>
      <!-- Thanh ngọc -->
      <rect x="340" y="260" width="60" height="24" fill="#2fd06a"/>
      <rect x="260" y="340" width="24" height="60" fill="#2fd06a"/>
    </g>
  </defs>
 
  <!-- Nền -->
  <rect width="800" height="800" fill="#14171a"/>
  <rect x="12" y="12" width="776" height="776" fill="none" stroke="#3d4449" stroke-width="4"/>
 
  <!-- Bốn phần tư lật gương -->
  <use xlink:href="#q"/>
  <use xlink:href="#q" transform="translate(800,0) scale(-1,1)"/>
  <use xlink:href="#q" transform="translate(0,800) scale(1,-1)"/>
  <use xlink:href="#q" transform="translate(800,800) scale(-1,-1)"/>
 
  <!-- Lõi trung tâm -->
  <polygon points="354.4,290 445.6,290 510,354.4 510,445.6 445.6,510 354.4,510 290,445.6 290,354.4" fill="#3d4449"/>
  <polygon points="362,310 438,310 490,362 490,438 438,490 362,490 310,438 310,362" fill="#2a2f33"/>
  <circle cx="400" cy="400" r="70" fill="#2fd06a"/>
  <circle cx="400" cy="400" r="44" fill="#14171a"/>
  <circle cx="400" cy="400" r="22" fill="#2fd06a"/>
</svg>
